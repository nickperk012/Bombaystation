<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#B8882E;--gold-light:#D4A84B;--gold-pale:#E8C878;
  --gold-dim:#7A5A18;--gold-dark:#4A3408;
  --green-deep:#071510;--amber:#C85A18;--cream:#F0E4C8;
}
html,body{height:100%;background:var(--green-deep);color:var(--cream);font-family:'EB Garamond',serif;overflow-x:hidden;}

.scene{position:fixed;inset:0;z-index:0;overflow:hidden;transform-origin:center;will-change:transform;}

/* SKY — deep green top fading to amber/orange at horizon, matching screenshot */
.sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    #040e0a 0%,
    #081812 8%,
    #0e2416 18%,
    #162e1c 28%,
    #1e3a20 36%,
    #2a4a22 43%,
    #3e5620 48%,
    #5e6018 52%,
    #846414 56%,
    #a87a10 59%,
    #c48e0c 62%,
    #d89808 65%,
    #e49c06 67%,
    #e88808 70%,
    #d87008 73%,
    #c05808 77%,
    #9a4008 81%,
    #6e2c08 86%,
    #3e1808 91%,
    #1e1008 96%,
    #0e2018 100%
  );
}

/* Warm amber glow at horizon center */
.sky-glow{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 30% at 22% 65%, rgba(220,140,10,0.5) 0%, transparent 58%),
    radial-gradient(ellipse 35% 20% at 18% 70%, rgba(255,180,20,0.35) 0%, transparent 44%);
}

/* Sun */
.sun{
  position:absolute;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle,#fffde8 0%,#ffe060 18%,#ffb020 38%,#e07810 58%,transparent 72%);
  left:18%;bottom:34%;
  box-shadow:0 0 55px 28px rgba(255,190,30,0.5),0 0 120px 60px rgba(220,120,10,0.35),0 0 220px 110px rgba(190,70,8,0.2);
  animation:sunP 6s ease-in-out infinite;
}
@keyframes sunP{
  0%,100%{box-shadow:0 0 55px 28px rgba(255,190,30,0.5),0 0 120px 60px rgba(220,120,10,0.35);}
  50%{box-shadow:0 0 75px 38px rgba(255,190,30,0.65),0 0 160px 80px rgba(220,120,10,0.48);}
}

/* Sun reflection on water */
.sun-refl{
  position:absolute;left:18%;bottom:0;height:36%;
  width:200px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,180,20,0.3) 0%,rgba(220,120,10,0.18) 35%,rgba(180,80,8,0.08) 65%,transparent 100%);
  filter:blur(10px);
  animation:reflP 4s ease-in-out infinite;
}
@keyframes reflP{0%,100%{opacity:0.8;width:200px;}50%{opacity:1;width:230px;}}

/* Ocean */
.ocean-wrap{position:absolute;left:0;right:0;bottom:0;height:34%;}
.ocean-base{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(10,28,16,0) 0%,rgba(7,20,12,0.6) 18%,
    rgba(5,14,8,0.85) 40%,rgba(4,10,6,0.97) 65%,#030806 100%
  );
}
.ocean-sides{
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(6,24,14,0.65) 0%,rgba(6,24,14,0.2) 28%,transparent 42%,transparent 58%,rgba(6,24,14,0.2) 72%,rgba(6,24,14,0.65) 100%);
}
.waves{position:absolute;left:0;right:0;top:0;height:50%;}
.wl{
  position:absolute;left:-5%;width:112%;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(180,120,20,0.12) 18%,rgba(255,180,30,0.3) 42%,rgba(255,200,40,0.4) 50%,rgba(255,180,30,0.3) 58%,rgba(180,120,20,0.12) 82%,transparent 100%);
  animation:wM 9s ease-in-out infinite;
}
.wl:nth-child(1){top:6%}.wl:nth-child(2){top:16%;animation-delay:1.8s;opacity:0.7;}
.wl:nth-child(3){top:28%;animation-delay:3.6s;opacity:0.5;}.wl:nth-child(4){top:42%;animation-delay:5.4s;opacity:0.32;}
.wl:nth-child(5){top:58%;animation-delay:7.2s;opacity:0.18;}
@keyframes wM{0%,100%{transform:translateX(0)scaleY(1);}50%{transform:translateX(-2%)scaleY(2.2);}}

.shore{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,rgba(3,8,4,0) 0%,rgba(3,8,4,0.92) 45%,#020604 100%);}

/* ── PALMS ── 10 total, tall and lush */
.palm{position:absolute;bottom:0;}

/* far background */
.pbg1{left:22%;bottom:30%;}.pbg1 svg{width:65px;height:195px;opacity:0.35;}
.pbg2{right:22%;bottom:30%;}.pbg2 svg{width:60px;height:180px;opacity:0.3;}
.pbg3{left:34%;bottom:28%;}.pbg3 svg{width:55px;height:165px;opacity:0.28;}
.pbg4{right:34%;bottom:28%;}.pbg4 svg{width:50px;height:155px;opacity:0.25;}

/* foreground left */
.pl1{left:-4%;bottom:0;}.pl1 svg{width:250px;height:750px;}
.pl2{left:5%;bottom:0;}.pl2 svg{width:172px;height:560px;}
.pl3{left:13%;bottom:0;}.pl3 svg{width:130px;height:420px;}

/* foreground right */
.pr1{right:-4%;bottom:0;}.pr1 svg{width:225px;height:700px;}
.pr2{right:5%;bottom:0;}.pr2 svg{width:158px;height:520px;}
.pr3{right:13%;bottom:0;}.pr3 svg{width:118px;height:385px;}

/* Building silhouette */
.building{position:absolute;right:5%;bottom:33%;width:290px;opacity:0.62;transform-origin:bottom center;}

/* Lanterns */
.lanterns{position:absolute;bottom:9%;left:4%;display:flex;gap:16px;align-items:flex-end;}
.lantern{display:flex;flex-direction:column;align-items:center;}
.lcap{width:30px;height:7px;background:var(--gold-dim);border-radius:2px;margin-bottom:2px;}
.lbody{width:26px;height:38px;border:1px solid rgba(184,136,46,0.45);border-radius:5px 5px 8px 8px;background:rgba(14,22,14,0.8);position:relative;overflow:hidden;}
.lflame{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:9px;height:13px;background:radial-gradient(ellipse,#fff8d0 0%,#ffc030 36%,#f08010 66%,transparent 86%);border-radius:50% 50% 30% 30%;animation:flick 2.2s ease-in-out infinite;box-shadow:0 0 11px 4px rgba(240,148,18,0.5);}
.lflame.d2{animation-delay:0.8s;}.lflame.d3{animation-delay:1.5s;}
@keyframes flick{0%,100%{transform:translateX(-50%)scaleY(1);}40%{transform:translateX(-50%)scaleY(0.78)scaleX(1.18);}72%{transform:translateX(-50%)scaleY(1.18)scaleX(0.82);}}
.lfoot{width:20px;height:4px;background:var(--gold-dark);border-radius:1px;margin-top:2px;}

.grain{position:fixed;inset:0;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.05;pointer-events:none;}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 64% 64% at 50% 46%,transparent 32%,rgba(2,6,3,0.72) 100%),linear-gradient(90deg,rgba(2,6,3,0.42) 0%,transparent 20%,transparent 80%,rgba(2,6,3,0.42) 100%);}
.frame{position:fixed;inset:14px;z-index:3;border:1px solid rgba(184,136,46,0.28);pointer-events:none;}
.frame::before{content:'';position:absolute;inset:5px;border:1px solid rgba(184,136,46,0.11);}
.cor{position:absolute;width:34px;height:34px;border-color:var(--gold);border-style:solid;opacity:0.62;}
.cor.tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}.cor.tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}
.cor.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}.cor.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
.fdia{position:absolute;color:var(--gold);font-size:11px;opacity:0.5;}
.fdia.t{top:-7px;left:50%;transform:translateX(-50%);}.fdia.b{bottom:-7px;left:50%;transform:translateX(-50%);}
.fdia.l{left:-7px;top:50%;transform:translateY(-50%);}.fdia.r{right:-7px;top:50%;transform:translateY(-50%);}

/* CONTENT */
.content{position:relative;z-index:4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px 75px;text-align:center;}
.top-rule{display:flex;align-items:center;gap:14px;width:100%;max-width:460px;margin-bottom:20px;opacity:0;animation:fadeUp 0.8s ease forwards 0.3s;}
.top-rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.top-rule em{font-style:normal;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.45em;color:var(--gold);}
.logo-wrap{width:195px;height:195px;border-radius:50%;position:relative;margin-bottom:24px;opacity:0;animation:scaleIn 1.1s cubic-bezier(0.16,1,0.3,1) forwards 0.5s,badgeGlow 5s ease-in-out infinite 1.8s;display:flex;align-items:center;justify-content:center;}
.logo-wrap::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(184,136,46,0.42);pointer-events:none;}
.logo-wrap::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(184,136,46,0.16);pointer-events:none;}
@keyframes badgeGlow{0%,100%{filter:drop-shadow(0 0 16px rgba(184,136,46,0.25)) drop-shadow(0 0 45px rgba(184,136,46,0.12));}50%{filter:drop-shadow(0 0 30px rgba(184,136,46,0.5)) drop-shadow(0 0 80px rgba(184,136,46,0.28));}}
.logo-img{width:195px;height:195px;border-radius:50%;object-fit:cover;display:block;}
.coming{font-family:'Cinzel Decorative',cursive;font-size:clamp(13px,3vw,21px);font-weight:400;letter-spacing:0.24em;color:rgba(184,136,46,0.65);text-transform:uppercase;opacity:0;animation:fadeUp 0.8s ease forwards 0.88s;}
.soon{font-family:'Cinzel Decorative',cursive;font-size:clamp(54px,13vw,102px);font-weight:900;line-height:0.88;background:linear-gradient(152deg,var(--gold-pale) 0%,var(--gold-light) 30%,var(--amber) 62%,var(--gold-dim) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 6px 28px rgba(200,90,24,0.48));opacity:0;animation:fadeUp 1s cubic-bezier(0.16,1,0.3,1) forwards 1.05s;}
.orn{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;margin:20px 0;opacity:0;animation:fadeUp 0.8s ease forwards 1.28s;}
.orn span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.orn em{font-style:normal;color:var(--gold);font-size:13px;}
.tags{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fadeUp 0.8s ease forwards 1.42s;}
.tag{font-family:'Cinzel',serif;font-size:clamp(9.5px,2vw,12px);letter-spacing:0.36em;color:var(--cream);text-transform:uppercase;}
.tdot{color:var(--gold);font-size:8px;}
.summer{margin-top:22px;border:1px solid var(--gold);padding:9px 36px;position:relative;background:rgba(3,8,4,0.52);backdrop-filter:blur(4px);opacity:0;animation:fadeUp 0.8s ease forwards 1.56s;}
.summer::before,.summer::after{content:'◆';position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font-size:9px;}
.summer::before{left:-5px;}.summer::after{right:-5px;}
.summer p{font-family:'Cinzel',serif;font-size:clamp(11px,2.2vw,13.5px);letter-spacing:0.32em;color:var(--gold-light);text-transform:uppercase;}
.loc{display:flex;align-items:center;gap:14px;margin-top:26px;opacity:0;animation:fadeUp 0.8s ease forwards 1.7s;}
.loc span{width:46px;height:1px;background:var(--gold-dim);}
.loc p{font-family:'Cinzel',serif;font-size:clamp(9px,1.7vw,11px);letter-spacing:0.46em;color:var(--gold-dim);text-transform:uppercase;}
.notify{margin-top:38px;display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;max-width:400px;opacity:0;animation:fadeUp 0.8s ease forwards 1.84s;}
.nlabel{font-family:'EB Garamond',serif;font-style:italic;font-size:15px;color:rgba(240,228,200,0.48);}
.nrow{display:flex;width:100%;border:1px solid var(--gold-dim);backdrop-filter:blur(6px);}
.nrow input{flex:1;background:rgba(3,8,4,0.75);border:none;outline:none;padding:12px 16px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.18em;color:var(--cream);}
.nrow input::placeholder{color:rgba(184,136,46,0.3);}
.nrow button{background:var(--gold);border:none;cursor:pointer;padding:12px 19px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.25em;color:#030804;text-transform:uppercase;font-weight:700;transition:background 0.2s,letter-spacing 0.2s;}
.nrow button:hover{background:var(--gold-pale);letter-spacing:0.3em;}
.nsuccess{display:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.28em;color:var(--gold);text-transform:uppercase;}
.born{margin-top:38px;display:flex;align-items:center;gap:12px;opacity:0;animation:fadeUp 0.8s ease forwards 2s;}
.born span{width:70px;height:1px;}
.born span:first-child{background:linear-gradient(90deg,transparent,var(--gold-dim));}.born span:last-child{background:linear-gradient(90deg,var(--gold-dim),transparent);}
.born em{font-style:normal;color:rgba(122,90,24,0.6);font-size:13px;letter-spacing:0.15em;}
.social{margin-top:18px;display:flex;gap:26px;opacity:0;animation:fadeUp 0.8s ease forwards 2.1s;}
.social a{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.35em;color:rgba(184,136,46,0.4);text-decoration:none;text-transform:uppercase;transition:color 0.2s;}
.social a:hover{color:var(--gold);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.72) rotate(-8deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}
</style>
</head>
